<!DOCTYPE html>
<html>
<head>
    <title>Chess</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8" />

    <link rel="icon" href="https://discoverthreejs.com/favicon.ico" type="image/x-icon">

    <link href="./styles/main.css" rel="stylesheet" type="text/css">

    <script type="module" src="./src/main.js"></script>
</head>

<body>
    
    <div id="ui-layer">
        <div id="main-menu" class="menu-card">
            <h1>CHESS</h1>
            
            <div class="setting-group">
                <p>Play As:</p>
                <label>
                    <input type="radio" name="user-color" value="white" checked> White
                </label>
                <label>
                    <input type="radio" name="user-color" value="black"> Black
                </label>
                <p>Versus AI</p>
            </div>

            <div class="button-group">
                <button class="menu-btn" data-mode="ai">Versus AI</button>
                <button class="menu-btn" data-mode="online">PvP Online</button>
                <button class="menu-btn" data-mode="local">PvP Local</button>
            </div>
        </div>
    </div>
    
    <h1>Chess</h1>

    <div id="scene-container">
        <!-- canvas will be inserted here -->
    </div>
</body>

</html>
